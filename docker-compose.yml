services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: "file:/data/cifrastudio.db"
      JWT_SECRET: "${JWT_SECRET:-troque-este-valor-em-producao-use-openssl-rand-base64-48}"
      JWT_EXPIRES_IN: "7d"
      PORT: "3333"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      NODE_ENV: "production"
    volumes:
      - db_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3333/api}"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
    driver: local
